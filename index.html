<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xcortex | Universal NFC Analyzer</title>
<style>
:root{--bg:#0a0b10;--s:rgba(255,255,255,.03);--b:rgba(255,255,255,.08);--a:#ff5a2c;--t:#0fb3a6;--w:#fff;--m:#8b9bb4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace,sans-serif}
body{background:var(--bg);color:var(--w);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.cont{max-width:450px;width:100%;text-align:center}
h1{font-size:1.5rem;margin-bottom:5px;color:var(--a)}
.sub{color:var(--m);font-size:.8rem;margin-bottom:20px;text-transform:uppercase;letter-spacing:1px}

/* Mode Selector */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.mode-btn{background:rgba(255,255,255,.05);border:1px solid var(--b);color:var(--m);padding:10px;border-radius:8px;cursor:pointer;font-size:.75rem;transition:.2s;text-align:left;display:flex;flex-direction:column;justify-content:center;height:60px}
.mode-btn:hover{border-color:var(--t);color:var(--w)}
.mode-btn.active{background:rgba(15,179,166,.1);border-color:var(--t);color:var(--t);font-weight:bold}
.mode-icon{font-size:1.2rem;margin-bottom:2px}

/* Terminal Look */
.term-box{background:#000;border:1px solid #333;border-radius:8px;padding:15px;height:200px;overflow-y:auto;text-align:left;font-size:.8rem;line-height:1.4;margin-bottom:15px;position:relative}
.log-line{margin-bottom:3px;opacity:0;animation:fadeIn .2s forwards}
@keyframes fadeIn{to{opacity:1}}
.log-info{color:#aaa}.log-warn{color:#ffa500}.log-ok{color:#0f0}.log-err{color:#f44}.log-sys{color:#00ffff;font-weight:bold}

/* Progress Bar */
.progress-container{width:100%;height:6px;background:#222;border-radius:3px;margin-bottom:15px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--a),var(--t));transition:width .1s linear}

/* Buttons & Status */
.btn-start{width:100%;padding:15px;background:linear-gradient(135deg,#00c6ff,#0072ff);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;font-size:1rem;transition:.2s}
.btn-start:hover{transform:scale(1.02)}
.btn-start:disabled{background:#333;color:#666;cursor:not-allowed;transform:none}

.verdict-card{display:none;background:rgba(255,255,255,.05);border:1px solid var(--b);border-radius:12px;padding:15px;margin-top:15px;text-align:left}
.v-title{font-size:1rem;font-weight:bold;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.v-desc{color:var(--m);font-size:.85rem;line-height:1.4}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:bold;margin-left:5px}
.tag-safe{background:rgba(15,179,166,.2);color:var(--t)}
.tag-risk{background:rgba(255,90,44,.2);color:var(--a)}
.tag-bank{background:rgba(100,100,255,.2);color:#8bf}
.tag-open{background:rgba(255,255,0,.2);color:#ffeb3b}

.hidden{display:none!important}
.loader-small{width:12px;height:12px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--t);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Instruction Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;justify-content:center;align-items:center;backdrop-filter:blur(5px)}
.modal-overlay.act{display:flex}
.modal-content{background:#15161c;border:1px solid var(--t);padding:30px;border-radius:15px;text-align:center;max-width:300px;box-shadow:0 0 30px rgba(15,179,166,.2)}
.modal-icon{font-size:3rem;margin-bottom:10px}
.modal-text{color:#fff;font-size:1rem;margin-bottom:20px}
.modal-cancel{background:none;border:1px solid var(--b);color:var(--m);padding:8px 20px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<div class="cont">
    <h1>X<span>cortex</span> ANALYZER</h1>
    <div class="sub">Multi-Protocol NFC Diagnostic Tool</div>

    <!-- Mode Selection -->
    <div class="mode-grid">
        <button class="mode-btn active" id="btn-security" onclick="selectMode('security')">
            <span class="mode-icon">🛡</span> Security Audit
        </button>
        <button class="mode-btn" id="btn-signal" onclick="selectMode('signal')">
            <span class="mode-icon">⚡</span> Signal Strength
        </button>
        <button class="mode-btn" id="btn-structure" onclick="selectMode('structure')">
            <span class="mode-icon">📂</span> Data Structure
        </button>
        <button class="mode-btn" id="btn-rewrite" onclick="selectMode('rewrite')">
            <span class="mode-icon">✍️</span> Rewrite Potential
        </button>
        <button class="mode-btn" style="grid-column: span 2;" id="btn-clone" onclick="selectMode('clone')">
            <span class="mode-icon">🕵️</span> Cloning Risk Assessment
        </button>
    </div>

    <!-- Terminal Output -->
    <div class="term-box" id="terminal">
        <div class="log-line log-sys">SYSTEM READY.</div>
        <div class="log-line log-info">Select mode and press START.</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="pbar"></div>
    </div>

    <!-- Start Button -->
    <button class="btn-start" id="scan-btn" onclick="initiateScan()">▶ ЗАПУСТИТЬ АНАЛИЗ</button>

    <!-- Result Card -->
    <div class="verdict-card" id="result-card">
        <div class="v-title" id="v-icon">❓ Результат</div>
        <div class="v-desc" id="v-text">...</div>
        <div style="margin-top:10px;font-size:.7rem;color:var(--m)">UID: <span id="res-uid" style="font-family:monospace;color:#fff">---</span></div>
    </div>
</div>

<!-- INSTRUCTION MODAL -->
<div class="modal-overlay" id="instr-modal">
    <div class="modal-content">
        <div class="modal-icon">📱</div>
        <div class="modal-text">Приложите карту<br>к задней панели телефона</div>
        <button class="modal-cancel" onclick="cancelScan()">Отмена</button>
    </div>
</div>

<script>
let reader = null;
const SCAN_DURATION_MS = 5000; // Fixed 5 seconds
let currentMode = 'security';
let isScanning = false;
let startTime = 0;
let intervalId = null;

// --- MODE SELECTION LOGIC ---
function selectMode(mode) {
    if(isScanning) return alert("Дождитесь окончания сканирования!");
    currentMode = mode;
    
    // Update UI classes manually to avoid event issues
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    const targetBtn = document.getElementById(`btn-${mode}`);
    if(targetBtn) targetBtn.classList.add('active');
    
    const term = document.getElementById('terminal');
    term.innerHTML = `<div class="log-line log-sys">MODE SET: ${mode.toUpperCase()}</div>`;
    addLog("Ready to scan.", "info");
    resetUI();
}

// --- CORE LOGIC ---

async function initiateScan() {
    if(isScanning) return;
    
    if(!('NDEFReader' in window)) {
        alert("Web NFC not supported. Use Chrome on Android.");
        return;
    }

    // Show Instruction Modal First
    document.getElementById('instr-modal').classList.add('act');
    document.getElementById('scan-btn').disabled = true;
    document.getElementById('scan-btn').innerText = "ОЖИДАНИЕ МЕТКИ...";
}

function cancelScan() {
    document.getElementById('instr-modal').classList.remove('act');
    document.getElementById('scan-btn').disabled = false;
    document.getElementById('scan-btn').innerText = "▶ ЗАПУСТИТЬ АНАЛИЗ";
    resetUI();
}

async function startRealScan() {
    // Hide modal immediately when user sees it? No, we wait for tag detection logic below.
    // Actually, let's keep modal visible until tag is found or error occurs.
    
    try {
        reader = new NDEFReader();
        
        reader.addEventListener("reading", async ({ serialNumber, records }) => {
            // Tag Found! Close modal and start analysis
            document.getElementById('instr-modal').classList.remove('act');
            await stopScanner(); // Stop listening
            
            runSimulation(currentMode, serialNumber, records);
        });

        reader.addEventListener("error", (e) => {
             console.error(e);
             // Don't close modal yet, maybe retry? Or show error in terminal behind modal?
             // For simplicity, let's just log it. User can cancel.
        });

        await reader.scan();
        addLog("Scanner Active. Waiting for tag...", "warn");

    } catch (err) {
        document.getElementById('instr-modal').classList.remove('act');
        document.getElementById('scan-btn').disabled = false;
        document.getElementById('scan-btn').innerText = "▶ ЗАПУСТИТЬ АНАЛИЗ";
        addLog(`FATAL: ${err.message}`, "err");
    }
}

// Hook up the button click to actually start the scanner after showing modal
document.getElementById('scan-btn').addEventListener('click', () => {
    if(document.getElementById('instr-modal').classList.contains('act')) {
       // Already shown, do nothing extra here, logic is in initiateScan
    } else {
       initiateScan();
    }
});

// Wait, simpler approach: Click shows modal. We need a way to trigger scan AFTER modal is seen.
// Let's modify initiateScan to also call startRealScan but handle visibility better.

// RE-WRITING initiateScan for clarity:
window.initiateScan = async function() {
     if(isScanning) return;
     if(!('NDEFReader' in window)) { alert("No NFC"); return; }
     
     // Reset UI
     resetUI();
     document.getElementById('scan-btn').disabled = true;
     document.getElementById('scan-btn').innerHTML = '<span class="loader-small"></span> ИНИЦИАЛИЗАЦИЯ...';
     
     // Show Modal
     document.getElementById('instr-modal').classList.add('act');
     
     // Start Scanner in background
     try {
        reader = new NDEFReader();
        
        reader.addEventListener("reading", async ({ serialNumber, records }) => {
            // Success path
            document.getElementById('instr-modal').classList.remove('act');
            await stopScanner();
            
            // Update button state during simulation
            document.getElementById('scan-btn').innerText = "ANALYZING...";
            
            runSimulation(currentMode, serialNumber, records);
        });

        reader.addEventListener("error", (e) => {
             // Error path - keep modal open so user knows something happened? 
             // Better: Log error and stay waiting.
             addLog(`Wait Error: ${e.error.name}`, "err");
        });

        await reader.scan();
        addLog("Scanner Ready. Hold tag near phone.", "ok");

    } catch (err) {
        document.getElementById('instr-modal').classList.remove('act');
        document.getElementById('scan-btn').disabled = false;
        document.getElementById('scan-btn').innerText = "▶ ЗАПУСТИТЬ АНАЛИЗ";
        addLog(`Init Fail: ${err.message}`, "err");
    }
}


function stopScanner() {
    if(reader) try { await reader.stop(); } catch(e){}
    reader = null;
}

// The Simulation Engine (Runs for exactly 5 seconds)
function runSimulation(mode, uid, records) {
    isScanning = true;
    addLog(`TAG ACQUIRED. UID: ${uid}`, "sys");
    startTime = Date.now();
    let step = 0;
    
    intervalId = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min((elapsed / SCAN_DURATION_MS) * 100, 100);
        updateProgress(progress);
        step++;

        generateLogs(mode, step, uid, records);

        if(elapsed >= SCAN_DURATION_MS) {
            clearInterval(intervalId);
            showFinalVerdict(mode, uid, records);
        }
    }, 500); 
}

function generateLogs(mode, step, uid, records) {
    const hasData = records && records.length > 0;
    
    switch(mode) {
        case 'security':
            if(step <= 3) addLog(`Pulse #${step}: Checking encryption status...`, "warn");
            else if(step <= 7) addLog(`Pulse #${step}: Verifying sector access rights...`, "warn");
            else addLog(`Pulse #${step}: Analyzing handshake integrity...`, "info");
            break;
            
        case 'signal':
            const strength = hasData ? "STABLE" : "WEAK/NO DATA";
            addLog(`Signal Check #${step}: RSSI Level: ${strength} (-${Math.floor(20+Math.random()*10)}dBm)`, "info");
            break;
            
        case 'structure':
            if(step === 1) addLog(`Parsing Header Bytes...`, "info");
            if(step === 3) addLog(`Detecting Chip Family: ${hasData ? 'NDEF Compatible' : 'Raw ISO14443'}`, "ok");
            if(step === 5) addLog(`Mapping Memory Blocks...`, "warn");
            if(step === 8) addLog(`Extracting Metadata...`, "info");
            break;
            
        case 'rewrite':
            if(step <= 4) addLog(`Testing Write Permission Sector 0x00...`, "warn");
            if(step <= 8) addLog(`Simulating Payload Injection...`, "info");
            else addLog(`Validating CRC Checks...`, "ok");
            break;
            
        case 'clone':
            if(step <= 2) addLog(`Checking for Static UID Protection...`, "warn");
            if(step <= 5) addLog(`Analyzing Crypto Keys Exposure...`, "err");
            if(step <= 8) addLog(`Comparing with Known Clone Signatures...`, "info");
            break;
    }
}

function showFinalVerdict(mode, uid, records) {
    isScanning = false;
    document.getElementById('scan-btn').innerText = "✅ ГОТОВО";
    document.getElementById('scan-btn').disabled = false;
    
    const resultCard = document.getElementById('result-card');
    const iconEl = document.getElementById('v-icon');
    const textEl = document.getElementById('v-text');
    const uidEl = document.getElementById('res-uid');
    
    uidEl.innerText = uid;
    resultCard.style.display = 'block';
    const hasData = records && records.length > 0;

    if(mode === 'security') {
        if(hasData) {
            iconEl.innerHTML = '⚠️ <span class="tag tag-open">OPEN</span>';
            textEl.innerHTML = `<strong>Уязвимость найдена.</strong><br>Карта содержит открытые NDEF данные. Любой желающий может прочитать вашу информацию.`;
        } else {
            iconEl.innerHTML = '🔒 <span class="tag tag-bank">SECURE</span>';
            textEl.innerHTML = `<strong>Защищено.</strong><br>Доступ к данным запрещен протоколом безопасности (EMV/MIFARE Classic). Только UID доступен.`;
        }
    } 
    else if(mode === 'signal') {
        iconEl.innerHTML = '📶 <span class="tag tag-safe">GOOD</span>';
        textEl.innerHTML = `<strong>Связь установлена.</strong><br>Импульсы успешно достигли чипа. Расстояние оптимальное (< 2см).`;
    }
    else if(mode === 'structure') {
        iconEl.innerHTML = '🏷️ <span class="tag tag-info">INFO</span>';
        if(hasData) {
            textEl.innerHTML = `<strong>Тип: Smart Tag (NTAG/Ultralight).</strong><br>Обнаружено ${records.length} записей. Структура памяти доступна для чтения.`;
        } else {
            textEl.innerHTML = `<strong>Тип: Access Card / Bank Card.</strong><br>Память сегментирована и защищена. Чтение данных невозможно через Web API.`;
        }
    }
    else if(mode === 'rewrite') {
        if(hasData) {
            iconEl.innerHTML = '✍️ <span class="tag tag-risk">WRITABLE</span>';
            textEl.innerHTML = `<strong>Готова к записи.</strong><br>На этой метке можно безопасно перезаписать данные. Используйте функцию "Writer" для обновления контента.`;
        } else {
            iconEl.innerHTML = '🚫 <span class="tag tag-bank">READ ONLY</span>';
            textEl.innerHTML = `<strong>Только чтение.</strong><br>Попытки записи будут отклонены контроллером карты. Не пытайтесь модифицировать банковские документы.`;
        }
    }
    else if(mode === 'clone') {
        if(hasData) {
            iconEl.innerHTML = '☠️ <span class="tag tag-risk">HIGH RISK</span>';
            textEl.innerHTML = `<strong>Высокий риск клонирования.</strong><br>Данные открыты. Злоумышленник может скопировать содержимое на дешевый дубликат.`;
        } else {
            iconEl.innerHTML = '🛡 <span class="tag tag-safe">LOW RISK</span>';
            textEl.innerHTML = `<strong>Низкий риск.</strong><br>Физический UID уникален и неизменяем. Криптографические ключи скрыты. Клонирование через браузер невозможно.`;
        }
    }
}

function addLog(text, type = 'info') {
    const term = document.getElementById('terminal');
    const div = document.createElement('div');
    div.className = `log-line log-${type}`;
    div.innerText = text;
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
}

function updateProgress(percent) {
    document.getElementById('pbar').style.width = percent + '%';
}

function resetUI() {
    document.getElementById('result-card').style.display = 'none';
    updateProgress(0);
}

// Init
resetUI();
</script>
</body>
</html>
