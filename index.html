<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xcortex | NFC Analyzer</title>
<style>
:root{--bg:#0a0b10;--card:#15161c;--border:#2a2d35;--accent:#0fb3a6;--danger:#ff5a2c;--text:#fff;--muted:#8b9bb4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.container{max-width:450px;width:100%}

/* Header */
header{text-align:center;margin-bottom:20px}
h1{font-size:1.8rem;font-weight:800;letter-spacing:-1px}
h1 span{color:var(--accent)}
.subtitle{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:1px;margin-top:5px}

/* Mode Grid */
.modes{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;margin-bottom:20px}
.mode-btn{
    background:var(--card);border:1px solid var(--border);color:var(--muted);
    padding:12px;border-radius:10px;cursor:pointer;transition:.2s;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    font-size:.85rem;font-weight:600;height:70px;
}
.mode-btn:hover{border-color:var(--accent);color:var(--text)}
.mode-btn.active{
    background:rgba(15,179,166,.1);border-color:var(--accent);color:var(--accent);
    box-shadow:0 0 10px rgba(15,179,166,.2);
}
.mode-icon{font-size:1.2rem;margin-bottom:4px}

/* Terminal Area */
.terminal-wrapper{
    background:#000;border:1px solid var(--border);border-radius:12px;
    height:250px;overflow-y:auto;padding:15px;margin-bottom:15px;
    font-family:'Courier New', Courier, monospace;font-size:.85rem;line-height:1.5;
    scrollbar-width:thin;scrollbar-color:var(--border) #000;
}
.log-line{margin-bottom:4px;word-wrap:break-word}
.log-sys{color:#00ffff;font-weight:bold}
.log-info{color:#aaa}
.log-warn{color:#ffa500}
.log-ok{color:#0f0}
.log-err{color:#f44}

/* Progress Bar */
.progress-track{height:6px;background:#222;border-radius:3px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#00c6ff);transition:width .1s linear}

/* Main Button */
.action-btn{
    width:100%;padding:16px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;
    font-size:1.1rem;font-weight:700;cursor:pointer;transition:.2s;
    text-transform:uppercase;letter-spacing:1px;
}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,198,255,.3)}
.action-btn:disabled{background:#333;color:#666;cursor:not-allowed;transform:none;box-shadow:none}

/* Result Card */
.result-card{
    margin-top:20px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:20px;display:none;animation:fadeIn .3s ease-out;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.res-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.res-badge{padding:4px 8px;border-radius:6px;font-size:.75rem;font-weight:bold;text-transform:uppercase}
.badge-safe{background:rgba(15,179,166,.2);color:var(--accent)}
.badge-risk{background:rgba(255,90,44,.2);color:var(--danger)}
.badge-bank{background:rgba(100,100,255,.2);color:#8bf}
.res-title{font-size:1.1rem;font-weight:700}
.res-desc{color:var(--muted);font-size:.9rem;line-height:1.5;margin-bottom:10px}
.res-uid{font-family:monospace;font-size:.8rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:10px}

/* Modal Overlay */
.modal-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.9);backdrop-filter:blur(5px);
    z-index:1000;display:none;justify-content:center;align-items:center;
}
.modal-overlay.show{display:flex}
.modal-box{
    background:var(--card);border:1px solid var(--accent);border-radius:16px;
    padding:30px;text-align:center;max-width:300px;width:90%;
    box-shadow:0 0 30px rgba(15,179,166,.2);
}
.modal-icon{font-size:3rem;margin-bottom:15px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.modal-text{font-size:1.1rem;font-weight:600;margin-bottom:20px;color:var(--text)}
.modal-cancel{
    background:none;border:1px solid var(--border);color:var(--muted);
    padding:10px 20px;border-radius:8px;cursor:pointer;font-size:.9rem;
}
.modal-cancel:hover{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>X<span>cortex</span></h1>
        <div class="subtitle">NFC Security Auditor v2.0</div>
    </header>

    <!-- Modes -->
    <div class="modes">
        <button class="mode-btn active" id="btn-security" onclick="setMode('security')">
            <span class="mode-icon">🛡</span> Security Audit
        </button>
        <button class="mode-btn" id="btn-signal" onclick="setMode('signal')">
            <span class="mode-icon">⚡</span> Signal Check
        </button>
        <button class="mode-btn" id="btn-structure" onclick="setMode('structure')">
            <span class="mode-icon">📂</span> Data Structure
        </button>
        <button class="mode-btn" id="btn-rewrite" onclick="setMode('rewrite')">
            <span class="mode-icon">✍️</span> Rewrite Test
        </button>
        <button class="mode-btn" style="grid-column: span 2;" id="btn-clone" onclick="setMode('clone')">
            <span class="mode-icon">🕵️</span> Cloning Risk
        </button>
    </div>

    <!-- Terminal -->
    <div class="terminal-wrapper" id="terminal">
        <div class="log-line log-sys">SYSTEM INITIALIZED.</div>
        <div class="log-line log-info">Select mode and press START ANALYSIS.</div>
    </div>

    <!-- Progress -->
    <div class="progress-track">
        <div class="progress-fill" id="pbar"></div>
    </div>

    <!-- Action Button -->
    <button class="action-btn" id="main-btn" onclick="startProcess()">▶ ЗАПУСТИТЬ АНАЛИЗ</button>

    <!-- Result -->
    <div class="result-card" id="result-card">
        <div class="res-header">
            <span class="res-badge badge-safe" id="res-badge">SAFE</span>
            <span class="res-title" id="res-title">Analysis Complete</span>
        </div>
        <div class="res-desc" id="res-desc">Description goes here...</div>
        <div class="res-uid">UID: <span id="res-uid-val">---</span></div>
    </div>
</div>

<!-- Scanning Modal -->
<div class="modal-overlay" id="scan-modal">
    <div class="modal-box">
        <div class="modal-icon">📱</div>
        <div class="modal-text">Приложите карту<br>к задней панели телефона</div>
        <button class="modal-cancel" onclick="cancelScan()">Отмена</button>
    </div>
</div>

<script>
// State
let currentMode = 'security';
let reader = null;
let isProcessing = false;
let analysisTimer = null;

// DOM Elements
const termEl = document.getElementById('terminal');
const pBarEl = document.getElementById('pbar');
const mainBtn = document.getElementById('main-btn');
const modalEl = document.getElementById('scan-modal');
const resultCard = document.getElementById('result-card');

// --- LOGGING HELPER ---
function log(msg, type='info') {
    const div = document.createElement('div');
    div.className = `log-line log-${type}`;
    div.innerText = msg;
    termEl.appendChild(div);
    termEl.scrollTop = termEl.scrollHeight;
}

function clearLogs() {
    termEl.innerHTML = '';
}

// --- MODE SELECTION ---
function setMode(mode) {
    if(isProcessing) return alert("Wait for scan to finish!");
    
    currentMode = mode;
    
    // Update UI
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${mode}`).classList.add('active');
    
    // Reset Results
    resultCard.style.display = 'none';
    pBarEl.style.width = '0%';
    
    log(`MODE CHANGED: ${mode.toUpperCase()}`, 'sys');
}

// --- MAIN PROCESS FLOW ---

async function startProcess() {
    if(isProcessing) return;
    
    // 1. Check Support
    if(!('NDEFReader' in window)) {
        alert("Web NFC not supported on this device/browser.");
        return;
    }

    // 2. Prepare UI
    isProcessing = true;
    resultCard.style.display = 'none';
    pBarEl.style.width = '0%';
    clearLogs();
    log("INITIALIZING SCANNER...", 'sys');
    
    // Disable button visually
    mainBtn.disabled = true;
    mainBtn.innerText = "SCANNING...";

    // 3. Show Modal
    modalEl.classList.add('show');

    try {
        // 4. Start Reading
        reader = new NDEFReader();
        
        // Listen for tag detection
        reader.addEventListener("reading", async ({ serialNumber, records }) => {
            // Success! Hide modal immediately
            modalEl.classList.remove('show');
            
            // Stop scanning hardware
            await stopScanner();
            
            // Start the 5-second simulation
            runSimulation(serialNumber, records);
        });

        // Handle errors during waiting phase
        reader.addEventListener("error", (e) => {
            console.error(e);
            // Keep modal open, user might move card away briefly
        });

        await reader.scan();
        log("WAITING FOR TAG...", 'warn');

    } catch (err) {
        modalEl.classList.remove('show');
        resetUI();
        log(`ERROR: ${err.message}`, 'err');
        alert("Failed to start scanner: " + err.message);
    }
}

function cancelScan() {
    if(reader) {
        stopScanner().then(() => {
            resetUI();
            log("SCAN CANCELLED BY USER.", 'err');
        });
    } else {
        resetUI();
    }
}

async function stopScanner() {
    if(reader) {
        try { await reader.stop(); } catch(e){}
        reader = null;
    }
}

function resetUI() {
    isProcessing = false;
    modalEl.classList.remove('show');
    mainBtn.disabled = false;
    mainBtn.innerText = "▶ ЗАПУСТИТЬ АНАЛИЗ";
    pBarEl.style.width = '0%';
}

// --- SIMULATION ENGINE (5 Seconds) ---

function runSimulation(uid, records) {
    log(`TAG DETECTED. UID: ${uid}`, 'ok');
    log("STARTING DEEP ANALYSIS PROTOCOL...", 'sys');
    
    let startTime = Date.now();
    const duration = 5000; // 5 seconds
    
    // Interval every 500ms for logs/progress
    analysisTimer = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min((elapsed / duration) * 100, 100);
        pBarEl.style.width = `${progress}%`;
        
        // Generate fake technical logs based on mode
        generateFakeLogs(currentMode, uid, records);
        
        // Finish condition
        if(elapsed >= duration) {
            clearInterval(analysisTimer);
            finalizeAnalysis(uid, records);
        }
    }, 500);
}

function generateFakeLogs(mode, uid, records) {
    const hasData = records && records.length > 0;
    const rand = Math.floor(Math.random() * 100);
    
    switch(mode) {
        case 'security':
            if(rand % 2 === 0) log(`Checking encryption keys... [Sector 0x${rand.toString(16).toUpperCase()}]`, 'warn');
            else log(`Verifying access control lists...`, 'info');
            break;
        case 'signal':
            log(`Measuring RSSI signal strength... -${40+Math.floor(Math.random()*20)}dBm`, 'info');
            break;
        case 'structure':
            log(`Parsing NDEF TLV structure...`, 'info');
            if(hasData) log(`Found ${records.length} record(s). Decoding payload...`, 'ok');
            else log(`No NDEF data found. Raw ISO14443 stream only.`, 'warn');
            break;
        case 'rewrite':
            log(`Testing write permissions on Block 0...`, 'warn');
            log(`Simulating CRC calculation...`, 'info');
            break;
        case 'clone':
            log(`Comparing UID entropy with known clones...`, 'info');
            log(`Checking for static counter protection...`, 'warn');
            break;
    }
}

function finalizeAnalysis(uid, records) {
    isProcessing = false;
    mainBtn.disabled = false;
    mainBtn.innerText = "✅ АНАЛИЗ ЗАВЕРШЕН";
    
    const hasData = records && records.length > 0;
    const badge = document.getElementById('res-badge');
    const title = document.getElementById('res-title');
    const desc = document.getElementById('res-desc');
    const uidVal = document.getElementById('res-uid-val');
    
    uidVal.innerText = uid;
    resultCard.style.display = 'block';
    
    // Determine Verdict Logic
    let verdict = {};
    
    if(currentMode === 'security') {
        if(hasData) {
            verdict = { 
                cls: 'badge-risk', txt: 'OPEN', 
                title: 'Уязвимость обнаружена', 
                desc: 'Карта содержит открытые данные. Любой пользователь может их прочитать.' 
            };
        } else {
            verdict = { 
                cls: 'badge-bank', txt: 'SECURE', 
                title: 'Данные защищены', 
                desc: 'Чип не отдает данные через веб-API. Доступен только UID. Безопасно для идентификации.' 
            };
        }
    } 
    else if(currentMode === 'signal') {
        verdict = { 
            cls: 'badge-safe', txt: 'STABLE', 
            title: 'Сигнал стабилен', 
            desc: 'Расстояние до чипа оптимальное (<2см). Связь установлена успешно.' 
        };
    }
    else if(currentMode === 'structure') {
        if(hasData) {
            verdict = { 
                cls: 'badge-safe', txt: 'SMART TAG', 
                title: 'Тип: Перезаписываемая метка', 
                desc: `Обнаружено записей: ${records.length}. Чип поддерживает чтение и запись данных.` 
            };
        } else {
            verdict = { 
                cls: 'badge-bank', txt: 'ACCESS CARD', 
                title: 'Тип: Карта доступа / Банка', 
                desc: 'Структура памяти закрыта. Это банковская карта или проездной билет.' 
            };
        }
    }
    else if(currentMode === 'rewrite') {
        if(hasData) {
            verdict = { 
                cls: 'badge-risk', txt: 'WRITABLE', 
                title: 'Готова к записи', 
                desc: 'На эту метку можно безопасно записать новые данные через ваш сайт Xcortex Writer.' 
            };
        } else {
            verdict = { 
                cls: 'badge-bank', txt: 'READ ONLY', 
                title: 'Только чтение', 
                desc: 'Запись невозможна. Контроллер карты отклонит любые команды изменения данных.' 
            };
        }
    }
    else if(currentMode === 'clone') {
        if(hasData) {
            verdict = { 
                cls: 'badge-risk', txt: 'HIGH RISK', 
                title: 'Высокий риск клонирования', 
                desc: 'Данные открыты. Злоумышленник может скопировать содержимое на дешевый дубликат NTAG.' 
            };
        } else {
            verdict = { 
                cls: 'badge-safe', txt: 'LOW RISK', 
                title: 'Низкий риск', 
                desc: 'Физический UID уникален и защищен криптографией. Клонирование через браузер невозможно.' 
            };
        }
    }
    
    // Apply Verdict to UI
    badge.className = `res-badge ${verdict.cls}`;
    badge.innerText = verdict.txt;
    title.innerText = verdict.title;
    desc.innerText = verdict.desc;
    
    log("ANALYSIS COMPLETE.", 'sys');
}
</script>
</body>
</html>
